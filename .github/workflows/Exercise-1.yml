---
name: learning_jobs

on: 
   workflow_dispatch:

jobs:
     build:
      runs-on: ubuntu-latest
      steps:
        - name: create file
          run: echo "Hello from build job" > message.txt
        
        - name: upload artifact
          uses: actions/upload-artifact@v4
          with: 
             name: msg_artifact
             path: message.txt
      
     test:
       needs: build
       runs-on: ubuntu-latest
       steps:
        - name: Download Artifact
          uses: actions/download-artifact@v5
          with:
             name: msg_artifact

        - name: print message
          run: cat message.txt


         
           